<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Produto — PIVÔ</title>
<meta name="description" content="Bolsas, anabelas, papetes, plataformas, rasteiras e salto fino. Seu estilo te move.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#7A2614">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PIVÔ">
<meta property="og:title" content="Produto — PIVÔ">
<meta property="og:description" content="Bolsas, anabelas, papetes, plataformas, rasteiras e salto fino. Seu estilo te move.">
<meta property="og:image" content="img/campanha.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@400;500&family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
.pdp{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(32px,5vw,88px);align-items:start}
/* galeria: fotos empilhadas no desktop, carrossel com encaixe no celular */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal figure{position:relative;overflow:hidden;border-radius:18px;background:var(--sand);aspect-ratio:4/5;margin:0}
.gal figure:first-child{grid-column:1/-1;aspect-ratio:5/5.4}
.gal img{width:100%;height:100%;object-fit:cover;transition:scale 1.2s var(--out)}
.gal figure:hover img{scale:1.04}
.gal .badge{z-index:2}
.dots{display:none}

.info{position:sticky;top:120px}
.info .cat{font:600 12px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.info .cat a:hover{color:var(--rust)}
.info h1{margin-top:14px;font:400 clamp(34px,3.4vw,54px)/1.04 var(--serif);letter-spacing:-.02em}
.info .price{margin-top:16px;font:600 clamp(22px,1.8vw,28px)/1.2 var(--head)}
.info .meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px;font:400 14px/1 var(--body)}
.info .meta .stars svg{width:15px;height:15px}
.info .desc{margin-top:26px;font:400 16px/1.65 var(--body);color:var(--ink);max-width:36em}

.pick{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.pick__top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.pick__top b{font:500 15px/1 var(--body)}
.pick__top a{font:400 14px/1 var(--body);text-decoration:underline;text-underline-offset:3px}
.pick .size{min-width:52px;height:52px;font-size:15px}
.err{margin-top:10px;font:500 14px/1.4 var(--body);color:#A42B12;min-height:20px}
.buy{display:flex;gap:10px;margin-top:18px}
.buy .btn{flex:1}
.buy .fav{position:static;width:56px;height:56px;border:1px solid rgba(122,38,20,.25);background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.wa{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font:400 15px/1.4 var(--body);border-bottom:1px solid rgba(122,38,20,.35);padding:8px 0}
.wa svg{width:19px;height:19px}

.acc{margin-top:30px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:60px;cursor:pointer;font:500 16px/1.2 var(--body)}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{position:relative;width:14px;height:14px}
.acc summary i::before,.acc summary i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:currentColor;transition:transform .4s var(--out)}
.acc summary i::after{transform:rotate(90deg)}
.acc details[open] summary i::after{transform:rotate(0)}
.acc .body{padding:0 0 22px;font:400 15px/1.65 var(--body);color:var(--ink)}
.acc ul{padding-left:18px}

.rel{margin-top:clamp(88px,12vh,140px)}
.rel__head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:clamp(28px,4vh,44px)}
.rel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2vw,28px)}

/* barra de compra fixa no celular */
.sticky-buy{display:none}
@media (max-width:900px){
  .pdp{grid-template-columns:1fr}
  .info{position:static}
  .rel .grid{grid-template-columns:repeat(2,1fr);gap:28px 12px}
  .rel .prod__row{flex-direction:column;gap:4px}
  .rel .prod__meta .stock{display:none}
}
@media (max-width:560px){
  .page{padding-top:96px}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 calc(-1*var(--gut));padding:0 var(--gut);scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal figure,.gal figure:first-child{flex:0 0 88%;aspect-ratio:4/5;scroll-snap-align:center}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
  .dots i{width:6px;height:6px;border-radius:3px;background:rgba(122,38,20,.25);transition:width .3s,background .3s}
  .dots i.on{width:20px;background:var(--rust)}
  .rel__head .btn{display:none}
  .toast{bottom:calc(160px + env(safe-area-inset-bottom))}
  .sticky-buy{position:fixed;z-index:24;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
    padding:8px 8px 8px 18px;border-radius:999px;background:var(--rust);color:var(--cream);box-shadow:0 12px 30px rgba(0,0,0,.2);
    transform:translateY(160%);transition:transform .5s var(--out)}
  .sticky-buy.show{transform:none}
  .sticky-buy span{flex:1;font:600 16px/1 var(--head)}
  .sticky-buy button{height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--cream);color:var(--rust);font:500 15px/1 var(--body);cursor:pointer}
}
</style>
</head>
<body>
<main class="page" id="main"></main>
<div class="sticky-buy" id="stickyBuy" aria-hidden="true"><span id="sbPrice"></span><button id="sbGo" tabindex="-1">Escolher tamanho</button></div>

<script src="js/catalogo.js"></script>
<script src="js/base.js"></script>
<script>
moldura('produto');
const p = produto(new URLSearchParams(location.search).get('id')) || PRODUTOS[0];
document.title = `${p.nome} — PIVÔ`;
const fotos = [p.img, p.uso].filter(Boolean);
const rel = PRODUTOS.filter(x => x.id !== p.id).sort((a, b) => (b.cat === p.cat) - (a.cat === p.cat)).slice(0, 4);

document.getElementById('main').innerHTML = `
  <nav class="crumbs" aria-label="Você está em"><a href="index.html">Início</a><span aria-hidden="true">/</span>
    <a href="${linkCat(p.cat)}">${catNome(p.cat)}</a><span aria-hidden="true">/</span><span aria-current="page">${p.nome}</span></nav>
  <div class="pdp">
    <div>
      <div class="gal" id="gal">${fotos.map((f, i) => `<figure data-in style="--rd:${i * .08}s"><img src="${f}" alt="${i ? p.nome + ' em uso' : p.nome}" ${i ? 'loading="lazy"' : ''}>${!i && p.novo ? '<span class="badge">Novo</span>' : ''}</figure>`).join('')}</div>
      <div class="dots" id="dots" aria-hidden="true">${fotos.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>
    </div>
    <div class="info" data-in style="--rd:.1s">
      <p class="cat"><a href="${linkCat(p.cat)}">${catNome(p.cat)}</a></p>
      <h1>${p.nome}</h1>
      <p class="price">${brl(p.preco)}</p>
      <div class="meta">${stars(p)}<span class="stock"><i></i>${p.estoque}</span></div>
      <p class="desc">${p.desc}</p>
      <div class="pick" id="pick">
        ${p.tam ? `<div class="pick__top"><b id="tamLbl">Tamanho</b><a href="#">Guia de tamanhos</a></div>
          <div class="sizes" role="group" aria-label="Escolha o tamanho">${p.tam.map(t => `<button class="size" data-t="${t}" aria-pressed="false" ${p.esgot.includes(t) ? `disabled aria-label="${t}, esgotado"` : ''}>${t}</button>`).join('')}</div>
          <p class="err" id="err" role="alert"></p>` : ''}
        <div class="buy">
          <button class="btn" id="add">Adicionar à sacola ${ICON.arrow}</button>
          <button class="fav" aria-pressed="false" aria-label="Favoritar ${p.nome}">${ICON.heart}</button>
        </div>
        <a class="wa" href="#">${ICON.wa}Dúvida no tamanho? Fale com a gente no WhatsApp</a>
      </div>
      <div class="acc">
        <details open><summary>Detalhes <i aria-hidden="true"></i></summary><div class="body"><ul>${p.detalhes.map(d => `<li>${d}</li>`).join('')}</ul></div></details>
        <details><summary>Cuidados <i aria-hidden="true"></i></summary><div class="body">Guarde em local arejado, longe do sol direto. Limpe com pano macio e seco.</div></details>
        <details><summary>Entrega e trocas <i aria-hidden="true"></i></summary><div class="body">Prazo e frete calculados na finalização da compra. Consulte a política de trocas e devoluções.</div></details>
      </div>
    </div>
  </div>
  <section class="rel" aria-labelledby="rel-t">
    <div class="rel__head"><h2 class="duo" id="rel-t"><span class="l1">Combina com</span><span class="l2">o seu passo.</span></h2>
      <a class="btn btn--ghost" href="catalogo.html">Ver todas as peças ${ICON.arrow}</a></div>
    <div class="grid">${rel.map(card).join('')}</div>
  </section>`;
revelar();

// tamanho: obrigatório para calçado
let tam = null;
const err = document.getElementById('err');
document.querySelectorAll('#pick .size').forEach(b => b.addEventListener('click', () => {
  tam = +b.dataset.t;
  document.querySelectorAll('#pick .size').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.getElementById('tamLbl').textContent = `Tamanho ${tam}`;
  if (err) err.textContent = '';
  document.getElementById('sbGo').textContent = 'Adicionar';
}));
function adicionar(){
  if (p.tam && !tam){
    err.textContent = 'Escolha um tamanho para adicionar à sacola.';
    document.querySelector('#pick .sizes').animate([{translate:'-6px 0'},{translate:'6px 0'},{translate:'0 0'}], {duration:300});
    document.getElementById('pick').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center'});
    return;
  }
  comprar(p.id, tam);
}
document.getElementById('add').addEventListener('click', adicionar);
document.querySelector('.buy .fav').addEventListener('click', e => { const f = e.currentTarget; f.setAttribute('aria-pressed', f.getAttribute('aria-pressed') !== 'true'); });

// celular: pontinhos da galeria e barra de compra quando o botão sai da tela
const gal = document.getElementById('gal'), dots = [...document.querySelectorAll('#dots i')];
gal.addEventListener('scroll', () => { const i = Math.round(gal.scrollLeft / gal.firstElementChild.offsetWidth); dots.forEach((d, k) => d.classList.toggle('on', k === i)); }, {passive:true});
document.getElementById('sbPrice').textContent = brl(p.preco);
if (!p.tam) document.getElementById('sbGo').textContent = 'Adicionar';
document.getElementById('sbGo').addEventListener('click', adicionar);
const sb = document.getElementById('stickyBuy');
new IntersectionObserver(([e]) => {
  const show = !e.isIntersecting && e.boundingClientRect.top < 0;
  sb.classList.toggle('show', show); sb.setAttribute('aria-hidden', !show);
  document.getElementById('sbGo').tabIndex = show ? 0 : -1;
}).observe(document.getElementById('add'));
</script>
</body>
</html>
