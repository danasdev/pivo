<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sacola — PIVÔ</title>
<meta name="description" content="Bolsas, anabelas, papetes, plataformas, rasteiras e salto fino. Seu estilo te move.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#7A2614">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PIVÔ">
<meta property="og:title" content="Sacola — PIVÔ">
<meta property="og:description" content="Bolsas, anabelas, papetes, plataformas, rasteiras e salto fino. Seu estilo te move.">
<meta property="og:image" content="img/campanha.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@400;500&family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
.cart{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(32px,5vw,80px);align-items:start;margin-top:clamp(28px,4vh,44px)}
.items{list-style:none;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:120px 1fr auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.item__img{display:block;border-radius:14px;overflow:hidden;background:var(--sand);aspect-ratio:4/5}
.item__img img{width:100%;height:100%;object-fit:cover}
.item h2{font:400 clamp(20px,1.7vw,26px)/1.15 var(--serif);letter-spacing:-.01em}
.item h2 a:hover{text-decoration:underline;text-underline-offset:4px}
.item .sub{margin-top:8px;font:400 14px/1.5 var(--body);color:var(--muted)}
.item .row{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;height:44px;border-radius:999px;border:1px solid rgba(122,38,20,.25)}
.qty button{width:44px;height:44px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.qty button svg{width:16px;height:16px}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty output{min-width:28px;text-align:center;font:500 15px/1 var(--body)}
.rm{border:0;background:none;cursor:pointer;font:400 14px/1 var(--body);text-decoration:underline;text-underline-offset:3px;color:var(--muted);min-height:44px}
.rm:hover{color:var(--rust)}
.item__price{font:600 17px/1.2 var(--head);white-space:nowrap}

.sum{position:sticky;top:120px;padding:clamp(24px,3vw,36px);border-radius:22px;background:#FBE8DB}
.sum h2{font:400 clamp(26px,2.2vw,34px)/1.1 var(--serif)}
.sum dl{margin-top:22px}
.sum .l{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font:400 15px/1.4 var(--body)}
.sum .l dd{text-align:right}
.sum .tot{border:0;padding-top:18px;font:600 20px/1.2 var(--head)}
.sum .note{margin-top:4px;font:400 13px/1.5 var(--body);color:var(--muted)}
.sum .btn{width:100%;margin-top:22px}
.sum .back{display:block;text-align:center;margin-top:14px;font:400 14px/1 var(--body);text-decoration:underline;text-underline-offset:3px;padding:12px 0}
.sum .wa{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font:400 14px/1.4 var(--body);padding:10px 0}
.sum .wa svg{width:18px;height:18px}

.empty{text-align:center;padding:clamp(56px,10vh,110px) 0}
.empty p{max-width:30em;margin:18px auto 30px;font:400 16px/1.6 var(--body);color:var(--muted)}

@media (max-width:900px){ .cart{grid-template-columns:1fr} .sum{position:static} }
@media (max-width:560px){
  .item{grid-template-columns:92px 1fr;gap:14px}
  .item__price{grid-column:2;grid-row:1;justify-self:end;font-size:15px}
  .item > div{grid-column:2}
  .item h2{padding-right:76px}
}
</style>
</head>
<body>
<main class="page">
  <nav class="crumbs" aria-label="Você está em"><a href="index.html">Início</a><span aria-hidden="true">/</span><span aria-current="page">Sacola</span></nav>
  <div id="conteudo"></div>
</main>

<script src="js/catalogo.js"></script>
<script src="js/base.js"></script>
<script>
moldura('sacola');
const box = document.getElementById('conteudo');
function desenhar(){
  const itens = Sacola.itens().map((i, k) => ({...i, k, p: produto(i.id)})).filter(i => i.p);
  if (!itens.length){
    box.innerHTML = `<div class="empty">
      <h1 class="duo"><span class="l1">Sua sacola está vazia.</span><span class="l2">O próximo passo é seu.</span></h1>
      <p>Explore as novas chegadas e escolha a peça que combina com o seu estilo.</p>
      <a class="btn" href="catalogo.html">Explorar o catálogo ${ICON.arrow}</a></div>`;
    return;
  }
  const qtd = itens.reduce((n, i) => n + i.q, 0);
  const sub = itens.reduce((n, i) => n + i.q * i.p.preco, 0);
  box.innerHTML = `
    <h1 class="duo"><span class="l1">Sua sacola.</span><span class="l2">${qtd} ${qtd === 1 ? 'peça escolhida' : 'peças escolhidas'}.</span></h1>
    <div class="cart">
      <ul class="items" aria-label="Itens da sacola">${itens.map(i => `
        <li class="item">
          <a class="item__img" href="${linkProd(i.p.id)}"><img src="${i.p.img}" alt="${i.p.nome}"></a>
          <div>
            <h2><a href="${linkProd(i.p.id)}">${i.p.nome}</a></h2>
            <p class="sub">${catNome(i.p.cat)}${i.t ? ` · Tamanho ${i.t}` : ''} · ${brl(i.p.preco)} cada</p>
            <div class="row">
              <div class="qty" role="group" aria-label="Quantidade de ${i.p.nome}">
                <button data-d="-1" data-k="${i.k}" aria-label="Diminuir" ${i.q < 2 ? 'disabled' : ''}>${ICON.minus}</button>
                <output aria-live="polite">${i.q}</output>
                <button data-d="1" data-k="${i.k}" aria-label="Aumentar">${ICON.plus}</button>
              </div>
              <button class="rm" data-rm="${i.k}">Remover</button>
            </div>
          </div>
          <span class="item__price">${brl(i.q * i.p.preco)}</span>
        </li>`).join('')}
      </ul>
      <aside class="sum" aria-labelledby="sum-t">
        <h2 id="sum-t">Resumo</h2>
        <dl>
          <div class="l"><dt>Subtotal (${qtd} ${qtd === 1 ? 'item' : 'itens'})</dt><dd>${brl(sub)}</dd></div>
          <div class="l"><dt>Frete</dt><dd>Calculado na finalização</dd></div>
          <div class="l tot"><dt>Total</dt><dd>${brl(sub)}</dd></div>
        </dl>
        <p class="note">O valor do frete entra no total na próxima etapa.</p>
        <a class="btn" href="#">Finalizar compra ${ICON.arrow}</a>
        <a class="wa" href="#">${ICON.wa}Prefere comprar pelo WhatsApp?</a>
        <a class="back" href="catalogo.html">Continuar comprando</a>
      </aside>
    </div>`;
}
box.addEventListener('click', e => {
  const q = e.target.closest('[data-d]'), r = e.target.closest('[data-rm]');
  if (q && !q.disabled){ Sacola.mudar(+q.dataset.k, +q.dataset.d); desenhar(); }
  if (r){ Sacola.tirar(+r.dataset.rm); desenhar(); }
});
addEventListener('storage', desenhar);
desenhar();
</script>
</body>
</html>
